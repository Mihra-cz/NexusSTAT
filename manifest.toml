# Projektový manifest. Cesty jsou PLÁNOVANÉ, ne potvrzení existence.
schema_version = 1

[project]
id = "nexusstat"
name = "NexusSTAT"
description = "Lokální diagnostika Nexusu a plánovaná náhrada aplikačních funkcí Pironman 5"
created = "2026-10-19"
last_reviewed = "2026-10-22"
owner = "Mihra-cz" # veřejná identita (GitHub)
license = "MIT" # viz LICENSE
status = "development" # lokální vývoj na notebooku; nasazení viz platform.deployment

[platform]
hostname = "nexus"
architecture = "arm64"
os_family = "Debian 13"
deployment = "not-deployed"

[paths]
project = "/srv/nexus/projects/nexusstat"
stack = "/srv/nexus/stacks/nexusstat"
appdata = "/srv/nexus/appdata/nexusstat"
external_data = [] # monitoring NAS se bude navrhovat odděleně

[services]
systemd = []
docker = []
ports = [] # 8765 zatím NENÍ přidělený/otevřený
healthcheck = "not-configured"

[security]
internet_exposure = false
cloud_required = false
nas_write_access = false
secrets_location = "not-configured"

[backup]
job = "existing-host-restic-job" # skutečný název jednotky je v soukromé dokumentaci Nexusu
project_files_included = "unverified"
runtime_data_policy = "review-before-deployment"
live_database_excluded = "not-applicable" # SQLite zatím neexistuje; plán M2: Restic vyloučí appdata/nexusstat/history/ (živá DB, -wal, -shm)
consistent_database_snapshot = "implemented-locally-only" # M3.4a: konzistentní snímky přes Backup API jako neměnné generace v appdata/nexusstat/snapshot/<generace>/ (databáze + JSON záznam, zveřejnění jediným přejmenováním adresáře bez přepsání jakéhokoli existujícího cíle přes renameat2 RENAME_NOREPLACE, jehož podpora se na úložišti ověřuje zkouškou a bez níž se nic nezveřejní, rozpracované v snapshot-work/); jen na notebooku nad dočasnými adresáři, plánování a Restic jsou M3.4b a M7 (docs/HISTORY.md, sekce 9)
restore_tested = false
last_restore_test = "not-tested"

[integrations]
pironman5 = "replacement-planned; existing-service-must-remain-running"
oled = "planned; offline-simulator-only (local tests, 5 carousel pages incl. NETWORK); hardware-not-integrated"
oled_language = "english-ascii" # texty displeje z id, stavu, measurement a details (oled_text.py), ne ze summary; výjimka jen jednotky B/s, KB/s, MB/s; terminál a dokumentace česky
network = "implemented-locally (v0.6, notebook only); not-deployed" # read-only: /sys/class/net, /proc/net/route, ioctl SIOCGIFADDR bez odesílání
oled_font = "bundled X11 misc-fixed 8x13B + 6x13 (public domain, src/nexusstat/fonts)"
service_collectors = "not-implemented" # stránka SERVICES jen zobrazuje; Docker, NAS, Restic, AnimeDB se nečtou
rgb = "planned; not-integrated"
animedb = "future; not-deployed"

[runtime]
# Skutečný stav lokálního kódu. Cílový způsob provozu na Nexusu je v [planned].
language = "python"
python_min = "3.11" # tomllib
python_verified = "3.12.3 (developer notebook)"
dependencies_required = [] # pouze standardní knihovna
dependencies_optional = ["Pillow", "tkinter"] # Pillow: obraz OLED (ověřeno 10.2.0); tkinter (python3-tk 3.12.3, Tk 8.6.14): okno živého simulátoru, na notebooku nainstalováno 2026-10-19

[development]
# Lokální vývoj na notebooku. Nic z toho neběží na Nexusu (viz platform.deployment).
location = "developer-notebook-only"
last_verified = "2026-10-22"
implemented_locally = ["core-state-model", "oled-state-machine", "oled-image-simulator", "system-collector-readonly", "periodic-collection-loop-terminal", "numeric-measurements", "threshold-evaluator", "oled-services-page-display-only", "oled-live-preview-tkinter", "oled-english-text-layer", "network-collector-readonly", "oled-network-page", "sqlite-history-schema-v1-create-open-validate", "sqlite-history-transactional-writer-sync", "sqlite-history-aggregation-5m-1h-sync", "sqlite-history-retention-sync", "sqlite-history-writer-thread-queues", "sqlite-history-optional-loop-recording", "clock-sync-readonly-probe", "sigterm-graceful-shutdown", "sqlite-history-automatic-maintenance", "clock-stability-evidence", "collector-failure-detail", "sqlite-snapshot-generations", "snapshot-restore-check", "storage-path-checks"] # M3.1a–M3.3a nad testovacími databázemi; M3.3b-1 volitelné napojení na run.py (sekce [history], výchozí vypnuto, jen role development na výslovné cestě mimo repozitář), kontrola history.storage, read-only zdroj synchronizace hodin a boot_id, SIGINT/SIGTERM; M3.3b-2 automatická agregace a retence z vlákna zapisovače (agregace po potvrzené dávce, retence nejvýš jednou za hodinu a jen s doloženou 24h stabilitou hodin), diagnostika údržby a strukturovaný údaj o selhání kolektoru
preview_window_tested = true # skutečné okno na notebooku (X11, Tk 8.6.14); jen vývojový nástroj, ne hardware displeje
system_collector_sources = ["/proc/stat", "/proc/meminfo", "/sys/class/thermal", "statvfs(/)"]
network_collector_sources = ["/sys/class/net", "/proc/net/route", "ioctl SIOCGIFADDR (unconnected socket, no traffic)"]
network_interface_selection = "[network] interface, else physical with default IPv4 route (lowest metric) > physical link up > any physical; ties by name; virtual never auto-selected"
collector_interval_default_seconds = 10 # [collector] interval_seconds; platnost výsledků = 3 × interval
history_recording = "optional-local-only; [history] enabled=false by default and no default path; role development only; the application never creates, replaces or overwrites a database; network filesystems (NAS/CIFS/NFS/9p/sshfs, bind mounts included), autofs and unverifiable storage refused after resolving symlinks, re-checked after opening; aggregation and retention run automatically in the writer thread; retention only with 24 h of continuously observed clock stability (proven span between observations, broken by gaps longer than max(3x interval, 300 s), clock jumps, resume from suspend and unrecorded event losses) and below the confirmed aggregation boundary, no VACUUM"
clock_sync_source = "read-only adjtimex query only (kernel max error below 16 s, same criterion as systemd NTPSynchronized); the systemd-timesyncd marker proves an earlier synchronisation in this boot and is diagnostic output only, never a source of the current state; unknown state never treated as synchronized; nothing is set and no NTP service is touched"
periodic_loop = "foreground-terminal-only; not-a-service"
verified_on = "x86_64 Linux Mint (unit tests + read-only run + periodic loop in terminal incl. network, illustrative test thresholds)"
raspberry_pi_tested = false
history_live_check = "2026-10-22 developer notebook: four short read-only runs into an explicitly created development database outside the repository (the last one after the review tightened the storage checks), 21 measurements, 126 samples in 6 series, 44 state changes, no loss events, every run clean_stop=1 after SIGTERM (exit 0), aggregation_state untouched"
hardware_display_tested = false
alarm_thresholds = "configurable (cpu_temp, disk_root); disabled-by-default; no-approved-values"
alarm_actions = "none" # alarm jen mění stav a výpis; žádné vypínání ani řízení ventilátorů
version_control = "git" # lokální repozitář od 2026-10-19, větev main; commity a push jen po schválení
repository = "https://github.com/Mihra-cz/NexusSTAT" # veřejný; bez interního standardu a údajů o síti
local_backup = "unverified"

[planned]
execution = "native-python; subject-to-review"
lan_port = 8765
public_dashboard = "read-only status/errors only; separate interface; not deployed"
hardware_switch = "requires separate approval and physical fan verification"
pironman_replacement = "target: replace Pironman 5 application software function by function; not started" # Pironman jen zastavit a zakázat, neodinstalovat (rollback)
history_database = "design M2 approved 2026-10-20 except R11/R13/R15 (deferred to M7); M3.1a implemented locally (schema v1 create/open/validate, single-writer lock, read-only open; test/development roles only, temp databases in tests); M3.1b implemented locally (synchronous HistoryRecorder: runs, batches guarded by run.last_batch, catalog samples, every state/details change, events, high water, loss summary; no thread, queue or run.py hook); M3.2a implemented locally (synchronous 5 min and 1 h aggregation of closed windows, explicit queue state, no overwrite, conflict stops aggregation); M3.2b implemented locally (retention dry-run plan and hourly bounded deletes, max 24 per run, only below confirmed aggregation and with stable synced clock; never run automatically, no VACUUM); M3.3a implemented locally (single writer thread owning the SQLite connection, bounded queues for measurements, changes and events, 60 s batches, backoff and reopen, fatal errors stop writing, unsynced data held then derived, honest stop with 10 s limit); M3.3b-1 implemented locally (optional [history] section, writer thread fed from run_loop with the real monotonic measurement time, read-only clock synchronisation source and boot_id, graceful SIGINT/SIGTERM stop with an honest report, history.storage check, 512 B UTF-8 limit per result; default off = unchanged v0.6 behaviour, aggregation and retention still not automatic); M3.3b-2 implemented locally (writer thread runs aggregation after each confirmed batch and retention at most hourly, own evidence of continuous clock synchronisation for ClockState, maintenance diagnostics in history.storage, structured collector failure datum, prepared OLED names HISTORY and HIST SNAPSHOT). Verified only on the developer notebook against a development database outside the repository; no deployment approved and no production database exists (docs/HISTORY.md). Proposal: paths.appdata/history/history.sqlite3, schema v1 (application_id NXST, user_version 1), WAL, synchronous=FULL, 60 s batches in own writer thread; snapshot via Backup API to paths.appdata/snapshot/ with marker JSON and freshness check (history.snapshot) for existing Restic"
history_sqlite_wal_reset = "fix UNKNOWN: notebook libsqlite3-0 3.45.1-1ubuntu2.8, Debian 13 3.46.1-7+deb13u1 (changelogs do not mention it); design: single writer/checkpoint connection, all others mode=ro; gate before deployment in docs/HISTORY.md 12.4"
history_retention = "M2 approved 2026-10-20 (R1-R4): raw 10 s at least 30 days (deleted only when aggregated), 5 min aggregates 1 year (alt. 1 min), hourly 10 years, no daily table; check changes and events 2 years; every state or significant details change stored individually, nothing merged (R4); future flapping detector separate, events only"
influxdb = "not-required by nexusstat; shutdown only after verifying no other users and approval"
oled_carousel = ["NEXUS", "SYSTEM", "STORAGE", "NETWORK", "SERVICES"] # plán; implementováno lokálně NEXUS, SYSTEM, DISK, NETWORK, SERVICES (v0.6); STORAGE a CPU FAN další fáze
milestones = "proposal M1-M7, see docs/ARCHITECTURE.md; v0.6 = NETWORK part of M4/M5 locally; M2 SQLite design ready for review (docs/HISTORY.md, 2026-10-20); M3 implementation, STORAGE and CPU FAN still planned"

[documentation]
readme = "README.md"
architecture = "docs/ARCHITECTURE.md"
operations = "docs/OPERATIONS.md"
changelog = "docs/CHANGELOG.md"
requirements = "docs/REQUIREMENTS.md"
history = "docs/HISTORY.md" # návrh M2, neimplementováno
history_benchmark = "tools/sqlite_history_benchmark.py" # jen dočasné syntetické databáze, není součástí aplikace
security = "docs/SECURITY.md"
