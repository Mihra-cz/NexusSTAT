# Projektový manifest. Cesty jsou PLÁNOVANÉ, ne potvrzení existence.
schema_version = 1

[project]
id = "nexusstat"
name = "NexusSTAT"
description = "Lokální diagnostika Nexusu a plánovaná náhrada aplikačních funkcí Pironman 5"
created = "2026-10-19"
last_reviewed = "2026-10-29"
owner = "Mihra-cz" # veřejná identita (GitHub)
license = "MIT" # viz LICENSE
status = "development" # lokální vývoj na notebooku; nasazení viz platform.deployment

[platform]
hostname = "nexus"
architecture = "arm64"
os_family = "Debian 13"
deployment = "not-deployed"

[paths]
project = "/srv/nexus/projects/nexusstat"
stack = "/srv/nexus/stacks/nexusstat"
appdata = "/srv/nexus/appdata/nexusstat"
external_data = [] # SERVICES-2 kontroluje NAS jen spojením TCP na port SMB; mounty NAS ani sdílené složky se nečtou

[services]
systemd = []
docker = []
ports = [] # 8765 zatím NENÍ přidělený/otevřený
healthcheck = "not-configured"

[security]
internet_exposure = false
cloud_required = false
nas_write_access = false # SERVICES-2: žádný účet NAS ani přihlášení SMB, jen pokus o spojení TCP
secrets_location = "not-configured"
docker_socket_access = false # rozhodnutí 2026-10-24: AnimeDB se kontroluje přes HTTP /health (SERVICES-1), ne přes Docker socket ani skupinu docker

[backup]
job = "existing-host-restic-job" # skutečný název jednotky je v soukromé dokumentaci Nexusu
monitoring = "systemd-job-result-only (SERVICES-3, implemented-locally, disabled-by-default; SCHED-1: queried at start, after the expected end of the next timer run, every 15 min while running, otherwise at most once a day; one retry after 60 min only for a transient query failure)" # ne obsah repozitáře; skript, kódy a uchování stavu systemd ověřit read-only na Nexusu
project_files_included = "unverified"
runtime_data_policy = "review-before-deployment"
live_database_excluded = "not-applicable" # na Nexusu SQLite neexistuje (lokálně M3); plán M2: Restic vyloučí appdata/nexusstat/history/ (živá DB, -wal, -shm)
consistent_database_snapshot = "implemented-locally-only" # M3.4b-2: rozpoznání obnovené databáze podle meta.snapshot_utc (jednorázová událost history.restored, evidence restored.* v meta, bez automatické obnovy), příkazy info/adopt/generations a návrh retence generací bez mazání (docs/HISTORY.md 9.6, 9.7); M3.4b-1: denní plánování ze sekce [history.snapshot] (výchozí vypnuto, výslovné adresáře, denní čas "HH:MM" a časové pásmo; nejvýš jeden pokus na plánovaný den, zmeškaný jen dnešní; plán je určený plánovaným okamžikem v UTC, ne dnem dokončení), kontrola history.snapshot (26/50 h) jen z údajů v paměti a auditní události; M3.4a: konzistentní snímky přes Backup API jako neměnné generace v appdata/nexusstat/snapshot/<generace>/ (databáze + JSON záznam, zveřejnění jediným přejmenováním adresáře bez přepsání jakéhokoli existujícího cíle přes renameat2 RENAME_NOREPLACE, jehož podpora se na úložišti ověřuje zkouškou a bez níž se nic nezveřejní, rozpracované v snapshot-work/); jen na notebooku nad dočasnými adresáři, plánování a Restic jsou M3.4b a M7 (docs/HISTORY.md, sekce 9)
restore_tested = false  # test obnovy na Nexusu dál neproběhl; lokálně jen snapshot.check_restore a adopt nad dočasnými databázemi
last_restore_test = "not-tested"
generation_retention = "design-only" # docs/HISTORY.md 9.7: nejvýš 7 generací, nic mladšího než 48 h, chráněná poslední platná i obnovitelná; hotový je jen read-only výpočet kandidátů a dry-run, mazání vyžaduje samostatné schválení po ověření Resticu a testu obnovy
database_adoption = "manual-command-only" # python3 -m nexusstat.history adopt: jen role test a development, offline databáze, vstup beze změny, nový soubor bez přepsání cíle

[integrations]
pironman5 = "replacement-planned; existing-service-must-remain-running"
oled = "planned; offline-simulator-only (local tests, 5 carousel pages incl. NETWORK); hardware-not-integrated"
oled_language = "english-ascii" # texty displeje z id, stavu, measurement a details (oled_text.py), ne ze summary; výjimka jen jednotky B/s, KB/s, MB/s; terminál a dokumentace česky
network = "implemented-locally (v0.6, notebook only); not-deployed; SCHED-2: RX/TX every 1 s from kernel counters, interface, link and IPv4 every 60 s and at once after the interface vanishes or is re-created" # read-only: /sys/class/net, /proc/net/route, ioctl SIOCGIFADDR bez odesílání
oled_font = "bundled X11 misc-fixed 8x13B + 6x13 (public domain, src/nexusstat/fonts)"
service_collectors = "animedb-http-health (SERVICES-1), nas-tcp-reachability (SERVICES-2) and backup-systemd-result (SERVICES-3), all implemented-locally and disabled-by-default; shared outage confirmation services.OutageConfirmation for AnimeDB and NAS only; SCHED-1 run.Scheduled: real checks only when due (AnimeDB 15 min, NAS 30 min, backup by its timer plan), the same last result between checks with its original validity" # sdílené složky NAS, obsah Resticu, Docker a služby Nexusu se nečtou
cpu_fan = "implemented-locally-readonly (M4-1); reads /sys/class/hwmon and /sys/class/thermal only, never writes sysfs and never controls the fan; one check with a simple ON/OFF state (measured RPM added as a supplementary number, REQ ON/REQ OFF when only the control request is known, no percentages and no estimated RPM); device chosen by hwmon identity, never by hwmonX number; no fault rule for request > 0 with 0 RPM; verified only against synthetic directories (this notebook exposes no hwmon fan) and must be verified read-only on Raspberry Pi 5"
rgb = "planned; not-integrated; RGB-1 decision logic (rgb.py) and four simulated LEDs in the live preview implemented locally (acknowledgements and brightness in window memory only, no driver, SPI or GPIO); behaviour approved 2026-10-23 (docs/REQUIREMENTS.md, RGB LED a potvrzování závad): off while the OLED sleeps; dim white at about half brightness while it is awake only in a verified healthy state; WARNING orange and ERROR red category blink codes (0.4 s on, 0.4 s off, 2 s pause after each group, all four LEDs together); CRITICAL red 0.25 s on / 0.25 s off, never silenced; UNKNOWN never blinks; LEDs switched off at driver start and clean stop, WS2812 may keep the last colour after a crash (M7 operating limitation); Pironman keeps controlling the LEDs until a separately approved takeover"
animedb = "not-deployed on Nexus; optional HTTP healthcheck implemented locally (SERVICES-1): [services.animedb] enabled=false by default, explicit url http://<IP>[:port]/.../health without default (no hostnames, credentials, query or fragment), timeout_seconds default 2 (max 5) as one deadline for connect, send and receive; one GET per check via socket + http.client, no environment proxy, no redirects, body max 4 KiB; SCHED-1: checked once per interval_seconds (default 900, 60-3600), after a first failure at most two confirmation retries 30 s apart and after the first success following a confirmed outage exactly one, result valid until the next planned check plus 3 loop ticks; HTTP 200 with JSON status ok = OK; refused/timeout/disconnected/unreachable/HTTP 5xx = ERROR only after 3 consecutive checks (UNKNOWN before, no blinking), cleared after 2 successful checks; other or invalid answer = UNKNOWN; no Docker socket; verified only against synthetic HTTP responses, never against a running AnimeDB"
nas = "tcp-reachability implemented-locally (SERVICES-2), disabled by default: [services.nas] enabled=false, explicit numeric IPv4/IPv6 host without default (no hostnames/DNS, no zone id, no unspecified address), port default 445 (1-65535), timeout_seconds default 2 (max 5); one TCP connect per check via socket.create_connection, socket closed immediately, nothing sent or read; SCHED-1: checked once per interval_seconds (default 1800, 60-3600), after a first failure at most two confirmation retries 30 s apart and after the first success following a confirmed outage exactly one, result valid until the next planned check plus 3 loop ticks; no SMB login, no share listing, no file reads, no SNMP, no DSM API, no mount or autofs access; connected = OK meaning only that the SMB service accepts connections (not share availability, data readability, backup writability or NAS hardware health); refused/timeout/ENETUNREACH/EHOSTUNREACH = ERROR (NAS OFFLINE) only after 3 consecutive checks (UNKNOWN NAS FAILING before, no blinking), cleared after 2 successful checks (NAS RECOVER between); local or unclear errors = UNKNOWN; disabled = N/A (until SERVICES-2 the NAS row was UNKNOWN); RGB category 2; verified only against fake sockets, never against the real NAS. SMB share availability: not-implemented. Restic backup verification: not-implemented"
backup = "systemd-job-result implemented-locally (SERVICES-3), disabled by default: [services.backup] enabled=false, explicit unit (.service) and optional timer (.timer) without defaults, timeout_seconds default 2 (max 5); one read-only /usr/bin/systemctl show per check with fixed arguments (LC_ALL=C, TZ=UTC), no shell, no sudo, no polkit rule, no journal, no Restic, no repository, no credentials, no NAS; OK only from a documented completed successful run (Result=success, ExecMainCode=1, ExecMainStatus=0, non-zero monotonic exit time) at most 26 h old, WARNING above 26 h, ERROR above 50 h; new failure WARNING while the backup is still fresh, otherwise ERROR; missing/masked/broken unit ERROR; inactive timer at least WARNING, never OK; ExecCondition skip (Result=exec-condition) neither success nor failure (state from the earlier documented success, otherwise UNKNOWN); unreadable, inconsistent (exit time without start, zeroed ExecMainCode) or lost systemd run data (system restart or unit unloaded from memory) UNKNOWN, never reported as a failure; last success remembered in process memory only, never across restarts; checks the systemd job result, not the Restic repository content; SCHED-1: no periodic polling, query at start, after the expected end of the next run (timer NextElapseUSecRealtime + last run duration + 5 min), every 15 min while running or up to 1 h after a due start, otherwise at most once a day (never later), a single retry after 60 min only when the query itself failed transiently (timeout, non-zero systemctl exit, resource error; not for invalid or inconsistent data or a real unit state), 26/50 h crossings recomputed between queries from the last trustworthy query without calling systemd; real systemctl format verified read-only on the notebook (systemd 255), never against the Nexus backup job"

[runtime]
# Skutečný stav lokálního kódu. Cílový způsob provozu na Nexusu je v [planned].
language = "python"
python_min = "3.11" # tomllib
python_verified = "3.12.3 (developer notebook)"
dependencies_required = [] # pouze standardní knihovna; zapnuté snímky ([history.snapshot]) navíc potřebují systémovou databázi časových pásem (balíček tzdata pro zoneinfo), jinak je pásmo chyba konfigurace
dependencies_optional = ["Pillow", "tkinter"] # Pillow: obraz OLED (ověřeno 10.2.0); tkinter (python3-tk 3.12.3, Tk 8.6.14): okno živého simulátoru, na notebooku nainstalováno 2026-10-19

[development]
# Lokální vývoj na notebooku. Nic z toho neběží na Nexusu (viz platform.deployment).
location = "developer-notebook-only"
last_verified = "2026-10-31"
implemented_locally = ["core-state-model", "oled-state-machine", "oled-image-simulator", "system-collector-readonly", "periodic-collection-loop-terminal", "numeric-measurements", "threshold-evaluator", "oled-services-page-display-only", "oled-live-preview-tkinter", "oled-english-text-layer", "network-collector-readonly", "oled-network-page", "sqlite-history-schema-v1-create-open-validate", "sqlite-history-transactional-writer-sync", "sqlite-history-aggregation-5m-1h-sync", "sqlite-history-retention-sync", "sqlite-history-writer-thread-queues", "sqlite-history-optional-loop-recording", "clock-sync-readonly-probe", "sigterm-graceful-shutdown", "sqlite-history-automatic-maintenance", "clock-stability-evidence", "collector-failure-detail", "sqlite-snapshot-generations", "snapshot-restore-check", "storage-path-checks", "snapshot-daily-schedule", "snapshot-diagnostics", "snapshot-audit-events", "restored-database-detection", "database-info-command", "manual-adopt-command", "generation-retention-dry-run", "cpu-fan-collector-readonly", "oled-system-page-four-rows", "rgb-decision-logic", "rgb-preview-simulation", "animedb-http-healthcheck", "nas-tcp-reachability", "backup-systemd-result", "mount-inventory-parser", "service-check-scheduling", "live-measurement-scheduling", "root-mount-mode-check"] # M3.1a–M3.3a nad testovacími databázemi; M3.3b-1 volitelné napojení na run.py (sekce [history], výchozí vypnuto, jen role development na výslovné cestě mimo repozitář), kontrola history.storage, read-only zdroj synchronizace hodin a boot_id, SIGINT/SIGTERM; M3.3b-2 automatická agregace a retence z vlákna zapisovače (agregace po potvrzené dávce, retence nejvýš jednou za hodinu a jen s doloženou 24h stabilitou hodin), diagnostika údržby a strukturovaný údaj o selhání kolektoru; M3.4a neměnné generace snímků a test obnovitelnosti; M3.4b-1 denní plánování snímků z měřicí smyčky, kontrola history.snapshot a auditní události (adresáře se nikdy nevytvářejí a ověřují se před prvním měřením; staré generace se nemažou); M3.4b-2 rozpoznání databáze obnovené ze snímku před prvním zápisem s jednorázovou evidencí, příkazy info (jen čtení běžným spojením mode=ro; immutable=1 jen na výslovný přepínač, nikdy podle absence -wal), adopt (ruční převzetí do nového souboru, vstup beze změny, SHA-256 před i po kopii) a generations (dry-run retence); obnovená databáze v režimu delete se zbylými pomocnými soubory se neotevře (cizí WAL by se přehrál), bez doloženého času se vůbec neotevírá pro zápis, mezeru hlásí history.unknown_gap; mazání generací zůstává neimplementované; M4-1 read-only kolektor ventilátoru CPU (jedna kontrola se stavem ON/OFF, otáčky jako doplňující číslo, REQ ON/OFF jen z požadavku řízení, výběr zařízení podle identity hwmon, žádný zápis do sysfs ani řízení) a čtvrtý řádek CPU FAN na stránce SYSTEM — ověřeno jen nad syntetickými adresáři, protože notebook žádný ventilátor v hwmon nemá; RGB-1 rozhodovací logika rgb.py a čtyři simulované LED v živém náhledu (potvrzení a jas jen v paměti okna, žádný ovladač, SPI ani GPIO); SERVICES-1 volitelný HTTP healthcheck AnimeDB s potvrzením výpadku třemi kontrolami (výchozí vypnuto, bez Dockeru; výsledek na SERVICES, ve STATUS, na NEXUS, v RGB, ve výpisu run a ve volitelné historii; ověřeno jen syntetickými odpověďmi HTTP); SERVICES-2 volitelná kontrola dostupnosti NAS jediným spojením TCP na port SMB se stejným potvrzováním výpadku (sdílené services.OutageConfirmation, výchozí vypnuto = N/A, bez přihlášení, sdílených složek a mountů; výsledek na SERVICES, ve STATUS, na NEXUS, v RGB kód 2, ve výpisu run a ve volitelné historii; scénáře simulátoru 18 a 19; ověřeno jen podvrženým spojením); SERVICES-3 volitelná kontrola výsledku existující zálohovací úlohy jediným read-only systemctl show (výchozí vypnuto = N/A, OK jen z doloženého dokončeného úspěšného běhu, 26/50 h, ztracené údaje systemd UNKNOWN, paměť úspěchu jen v procesu; výsledek na SERVICES, ve STATUS, na NEXUS, v RGB kód 4, ve výpisu run a ve volitelné historii; ověřeno syntetickým výstupem a read-only na neškodných jednotkách notebooku); M5-S1 read-only parser /proc/self/mountinfo pro inventuru úložišť (mounts.py: druhy local/network/virtual/autofs/unknown, escapované znaky, vnořené a skládané mounty, chybné řádky; body připojení se neotevírají, autofs se nespouští, přítomnost mountu nedokládá dostupnost; nenapojeno na smyčku ani OLED); SCHED-1 šetrné plánování kontrol služeb (obal run.Scheduled bez vlákna: AnimeDB jednou za 15 min, NAS jednou za 30 min, po prvním neúspěchu nejvýš dva pokusy po 30 s a po prvním úspěchu po potvrzeném výpadku jeden, zálohy podle plánu timeru ze systemd, při běhu po 15 min, jinak nejvýš jednou denně, po přechodném selhání dotazu jeden opravný za 60 min; mezi kontrolami tentýž výsledek s původní platností, přechod záloh přes 26/50 h přepočtem bez dotazu; za 24 h 96 + 48 + 2 skutečné kontroly místo 3 × 8640; ověřeno jen simulovaným časem a podvrženými odpověďmi); SCHED-2 živé měření (takt 1 s, síť RX/TX 1 s, CPU, teplota a RAM 5 s, ventilátor 10 s, rozhraní a IPv4 60 s, disk / 1800 s přes run.Scheduled s pevným intervalem; historie dál po 10 s se schématem v1, vytížení CPU a RX/TX jako měření za celé přesně pokryté okno zápisu (se zapnutou historií interval násobkem 5 s, společná mřížka kolektorů a zápisu); výpis jen při změně nebo po 30 min; 30s souhrny jen návrh HISTORY.md 12.5; režie na notebooku asi 0,3 % jádra)
preview_window_tested = true # skutečné okno na notebooku (X11, Tk 8.6.14), od RGB-1 i simulované LED (řízený běh skutečného okna); jen vývojový nástroj, ne hardware displeje ani LED
system_collector_sources = ["/proc/stat", "/proc/meminfo", "/sys/class/thermal", "statvfs(/)"]
root_mode_check = "implemented-locally-readonly (M5-S2): disk.root_readonly from /proc/self/mountinfo only (mounts.RootMountMonitor), every 60 s (disk.root stays every 1800 s); visible / mount, mode rw/ro from mount options or superblock, fstype, kind local/network/virtual/autofs/unknown; UNKNOWN with cause for an unreadable, invalid, incomplete or ambiguous table; rw = INFO, ro = ERROR (ROOT READ-ONLY through the existing STATUS, NEXUS and RGB rules; errors=remount-ro alone is not ro), no automatic repair, remount, restart or write; no stat/statvfs of mount points, no test write, no SMART"
network_collector_sources = ["/sys/class/net", "/proc/net/route", "ioctl SIOCGIFADDR (unconnected socket, no traffic)"]
network_interface_selection = "[network] interface, else physical with default IPv4 route (lowest metric) > physical link up > any physical; ties by name; virtual never auto-selected"
collector_interval_default_seconds = 10 # [collector] interval_seconds; od SCHED-2 jen zápis historie, její kontroly a plán snímků (platnost 3 × interval)
live_measurement_intervals_seconds = { tick = 1, network_rate = 1, cpu_temp_ram = 5, cpu_fan = 10, network_interface_ipv4 = 60, disk_root = 1800, disk_root_mode = 60 } # SCHED-2, pevné v kódu; platnost výsledku 3 × interval kolektoru
history_recording = "optional-local-only; [history] enabled=false by default and no default path; role development only; the application never creates, replaces or overwrites a database; visible mount from /proc/self/mountinfo via mounts.py (fixed 2026-10-28: a mount hidden by a later overmount of its parent no longer counts; the path is resolved component by component and the check never touches network storage or autofs); only local filesystems allowed (virtual tmpfs, ramfs, overlay and pseudo filesystems refused for SQLite); network filesystems (NAS/CIFS/NFS/9p/sshfs, bind mounts included), autofs, unknown filesystem types, a local mount nested inside a network mount and unverifiable storage (unreadable, incomplete or ambiguous mount table) refused, re-checked after opening; the filesystem type does not prove the physical location of the device; aggregation and retention run automatically in the writer thread; retention only with 24 h of continuously observed clock stability (proven span between observations, broken by gaps longer than max(3x interval, 300 s), clock jumps, resume from suspend and unrecorded event losses) and below the confirmed aggregation boundary, no VACUUM"
clock_sync_source = "read-only adjtimex query only (kernel max error below 16 s, same criterion as systemd NTPSynchronized); the systemd-timesyncd marker proves an earlier synchronisation in this boot and is diagnostic output only, never a source of the current state; unknown state never treated as synchronized; nothing is set and no NTP service is touched"
periodic_loop = "foreground-terminal-only; not-a-service; SCHED-2: 1 s tick, each collector only when due, history every [collector] interval_seconds, output only on a significant change or every 30 min"
verified_on = "x86_64 Linux Mint (unit tests + read-only run + periodic loop in terminal incl. network, illustrative test thresholds)"
raspberry_pi_tested = false
history_live_check = "2026-10-22 developer notebook: four short read-only runs into an explicitly created development database outside the repository (the last one after the review tightened the storage checks), 21 measurements, 126 samples in 6 series, 44 state changes, no loss events, every run clean_stop=1 after SIGTERM (exit 0), aggregation_state untouched"
hardware_display_tested = false
alarm_thresholds = "configurable (cpu_temp, disk_root); disabled-by-default; no-approved-values"
alarm_actions = "none" # alarm jen mění stav a výpis; žádné vypínání ani řízení ventilátorů
version_control = "git" # lokální repozitář od 2026-10-19, větev main; commity a push jen po schválení
repository = "https://github.com/Mihra-cz/NexusSTAT" # veřejný; bez interního standardu a údajů o síti
local_backup = "unverified"

[planned]
execution = "native-python; subject-to-review"
lan_port = 8765
public_dashboard = "read-only status/errors only; separate interface; not deployed"
hardware_switch = "requires separate approval and physical fan verification"
pironman_replacement = "target: replace Pironman 5 application software function by function; not started" # Pironman jen zastavit a zakázat, neodinstalovat (rollback)
history_database = "design M2 approved 2026-10-20 except R11/R13/R15 (deferred to M7); M3.1a implemented locally (schema v1 create/open/validate, single-writer lock, read-only open; test/development roles only, temp databases in tests); M3.1b implemented locally (synchronous HistoryRecorder: runs, batches guarded by run.last_batch, catalog samples, every state/details change, events, high water, loss summary; no thread, queue or run.py hook); M3.2a implemented locally (synchronous 5 min and 1 h aggregation of closed windows, explicit queue state, no overwrite, conflict stops aggregation); M3.2b implemented locally (retention dry-run plan and hourly bounded deletes, max 24 per run, only below confirmed aggregation and with stable synced clock; never run automatically, no VACUUM); M3.3a implemented locally (single writer thread owning the SQLite connection, bounded queues for measurements, changes and events, 60 s batches, backoff and reopen, fatal errors stop writing, unsynced data held then derived, honest stop with 10 s limit); M3.3b-1 implemented locally (optional [history] section, writer thread fed from run_loop with the real monotonic measurement time, read-only clock synchronisation source and boot_id, graceful SIGINT/SIGTERM stop with an honest report, history.storage check, 512 B UTF-8 limit per result; default off = unchanged v0.6 behaviour, aggregation and retention still not automatic); M3.3b-2 implemented locally (writer thread runs aggregation after each confirmed batch and retention at most hourly, own evidence of continuous clock synchronisation for ClockState, maintenance diagnostics in history.storage, structured collector failure datum, prepared OLED names HISTORY and HIST SNAPSHOT); M3.4a implemented locally (immutable snapshot generations published by a single atomic rename that never replaces an existing target, full verification, read-only restore check); M3.4b-1 implemented locally (optional [history.snapshot] section, daily plan (HH:MM plus an explicit timezone) evaluated by the measuring loop at most once per planned day, history.snapshot check from the in-memory status only, snapshot audit events, last provably valid generation found at start; no automatic deletion of generations and no automatic replacement of the live database); M3.4b-2 implemented locally (restored database recognised from meta.snapshot_utc before the first write, one-time history.restored plus history.unknown_gap in a single transaction, refusal of an unclear state and of leftover companion files beside a delete-mode database, no write-open without a trusted clock, read-only info command that never uses immutable=1 by itself, manual adopt command that never changes its input, verifies its SHA-256 before and after the copy and never overwrites a target, read-only generation retention plan; no automatic restore, no automatic replacement of the live database and no deletion of generations). Verified only on the developer notebook against a development database outside the repository; no deployment approved and no production database exists (docs/HISTORY.md). Proposal: paths.appdata/history/history.sqlite3, schema v1 (application_id NXST, user_version 1), WAL, synchronous=FULL, 60 s batches in own writer thread; snapshot via Backup API to paths.appdata/snapshot/ with marker JSON and freshness check (history.snapshot) for existing Restic"
history_sqlite_wal_reset = "fix UNKNOWN: notebook libsqlite3-0 3.45.1-1ubuntu2.8, Debian 13 3.46.1-7+deb13u1 (changelogs do not mention it); design: single writer/checkpoint connection, all others mode=ro; gate before deployment in docs/HISTORY.md 12.4"
history_30s_summaries = "design-only, awaiting approval (docs/HISTORY.md 12.5): RAM summaries per 30 s with min, max, sum and network bytes in a new agg_30s table (schema v2, manual migration only); interim SCHED-2 window measurement for CPU and RX/TX in 10 s raw samples (HISTORY.md 11.10)"
history_retention = "M2 approved 2026-10-20 (R1-R4): raw 10 s at least 30 days (deleted only when aggregated), 5 min aggregates 1 year (alt. 1 min), hourly 10 years, no daily table; check changes and events 2 years; every state or significant details change stored individually, nothing merged (R4); future flapping detector separate, events only"
alarm_acknowledgement = "design-only, approved 2026-10-23: LAN web acknowledgement of WARNING/ERROR stops only automatic RGB blinking and never changes the diagnostic state or the OLED; waking the OLED replays acknowledged codes once; survives a restart and ends only after at least 3 consecutive valid fault-free measurements (or the longer confirm_count of the alarm rule), UNKNOWN never counts; a new episode or WARNING -> ERROR needs a new acknowledgement; CRITICAL can only be marked as read and keeps blinking; owned by the main process, audit through the history writer queue; implemented only in the memory of the live preview (RGB-1), persistent store and web not implemented"
rgb_brightness = "design-only, approved 2026-10-23: single setting 5-100 %, default 20 %, white at about half of it; set by an authorised LAN user, persisted across restarts; not implemented"
user_state_file = "design-only, approved 2026-10-23: separate small file in paths.appdata for brightness, acknowledgements and the data needed to recognise a new episode or escalation; atomic write, private permissions, kept across restarts, included in backups; SQLite schema v1 unchanged, no new database subsystem; not implemented"
influxdb = "not-required by nexusstat; shutdown only after verifying no other users and approval"
oled_carousel = ["NEXUS", "SYSTEM", "STORAGE", "NETWORK", "SERVICES"] # plán; implementováno lokálně NEXUS, SYSTEM (od M4-1 se čtyřmi řádky včetně CPU FAN), DISK, NETWORK, SERVICES; STORAGE místo DISK je další fáze
milestones = "proposal M1-M7, see docs/ARCHITECTURE.md; v0.6 = NETWORK part of M4/M5 locally; M2 SQLite design ready for review (docs/HISTORY.md, 2026-10-20); M3 implemented locally; M4-1 CPU FAN read-only collector and four-row SYSTEM page implemented locally 2026-10-23 (synthetic sysfs only, must be verified read-only on Raspberry Pi 5); STORAGE instead of DISK still planned"

