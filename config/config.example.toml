# Ukázková konfigurace. Na Nexusu se zatím nic neaplikuje.
# Aktivní jsou jen položky, které kód skutečně načítá a validuje
# (src/nexusstat/config.py). Neznámý klíč i jiná sekce je chyba.
[oled]
width = 128   # podporováno pouze 128
height = 64   # podporováno pouze 64
carousel_seconds = 300    # celé sekundy 1–3600
page_seconds = 10         # celé sekundy 1–3600, nejvýše carousel_seconds
status_idle_seconds = 30  # celé sekundy 1–3600

[collector]
interval_seconds = 10  # celé sekundy 1–3600; platnost výsledků = 3 × interval (nenastavuje se zvlášť)

# Síťové rozhraní pro stránku NETWORK a výpis. Bez klíče interface se vybírá
# automaticky: fyzické rozhraní s výchozí trasou IPv4 (nejnižší metrika), jinak
# fyzické s linkou UP, jinak jakékoli fyzické; při shodě abecedně. Docker,
# VPN, loopback a další virtuální rozhraní se automaticky nevybírají.
# Zadaný název (1–15 znaků A–Z, a–z, 0–9, _ . -) se použije přesně, i virtuální.
[network]
# interface = "eth0"

# Alarmové prahy. Výchozí stav: vyhodnocování vypnuto, platné měření zůstává INFO.
# Prahy NEMAJÍ výchozí hodnoty a konkrétní čísla zatím nejsou schválená.
# Při enabled = true jsou povinné všechny tři: warning < error,
# 0 ≤ hysteresis < error − warning a warning − hysteresis nad dolní mezí rozsahu.
# Hodnota rovná prahu je nad prahem. Závada vzniká po confirm_count po sobě
# jdoucích měřeních nad prahem a odezní po clear_count měřeních pod
# (práh − hysteresis). UNKNOWN závadu nevyřeší. Žádná automatická akce.
[alarms.cpu_temp]   # °C, prahy v rozsahu (0, 125]
enabled = false
confirm_count = 3   # celé číslo 1–60
clear_count = 2     # celé číslo 1–60
# warning =
# error =
# hysteresis =

[alarms.disk_root]  # % obsazení /, prahy v rozsahu (0, 100]
enabled = false
confirm_count = 3
clear_count = 2
# warning =
# error =
# hysteresis =

# Ukládání historie do SQLite (M3.3b-1). Výchozí stav: vypnuto.
# Cesta NEMÁ výchozí hodnotu: bez `path` se nic neotevírá ani nevytváří.
# Při `enabled = true` musí `path` být absolutní cesta k souboru s příponou
# .sqlite3, který už vytvořil správce v roli `development`:
#   PYTHONPATH=src python3 -c "from pathlib import Path; from nexusstat import history; \
#     history.create_database(Path.home() / '.local/state/nexusstat/history.sqlite3', \
#                             'development', history.local_host_id())"
# Aplikace databázi nikdy nevytváří, nepřepisuje ani nenahrazuje: chybějící,
# cizí, poškozená nebo nekompatibilní databáze znamená, že se historie
# nezapisuje (stav kontroly `history.storage`), a měření běží dál.
# Roli nelze nastavit (vždy `development`), takže produkční databázi nelze
# otevřít omylem. Cesta na síťovém úložišti (NAS, CIFS, NFS) se odmítne.
# Interval dávky je 60 s (změny stavu se zapisují hned); automatická agregace
# a retence se v tomto kroku nespouštějí.
[history]
enabled = false
# path = "/home/uzivatel/.local/state/nexusstat/history.sqlite3"

# --- Budoucí možnosti: zatím NEIMPLEMENTOVÁNO a nenačítá se ---
# Nápis na první stránce je pevně NEXUS, hodiny jsou vždy 24h.
# Symboly na stránce NEXUS (trojúhelník / "?") nelze vypnout.
# Priorita STATUS: CRITICAL > ERROR > WARNING > UNKNOWN (pevně v kódu).
#
# [oled]
# home_title = "NEXUS"
# clock_24h = true
#
# [alarms]  # trojúhelník na stránce NEXUS zatím nejde vypnout
# show_warning_triangle = true
#
# [web]  # v první fázi není žádný web
# admin_listen = "127.0.0.1"
# admin_port = 8765  # plán, před nasazením ověřit dostupnost
# public_status_enabled = false
#
# [storage]  # žádná runtime DB zatím není; cesta bude schválena při nasazení
# history_mode = "events-only"
