# Ukázková konfigurace. Na Nexusu se zatím nic neaplikuje.
# Aktivní jsou jen položky, které kód skutečně načítá a validuje
# (src/nexusstat/config.py). Neznámý klíč v [oled] i jiná sekce je chyba.
[oled]
width = 128   # podporováno pouze 128
height = 64   # podporováno pouze 64
carousel_seconds = 300    # celé sekundy 1–3600
page_seconds = 10         # celé sekundy 1–3600, nejvýše carousel_seconds
status_idle_seconds = 30  # celé sekundy 1–3600

# --- Budoucí možnosti: zatím NEIMPLEMENTOVÁNO a nenačítá se ---
# Nápis na první stránce je pevně NEXUS, hodiny jsou vždy 24h.
# Symboly na stránce NEXUS (trojúhelník / "?") nelze vypnout.
# Priorita STATUS: CRITICAL > ERROR > WARNING > UNKNOWN (pevně v kódu).
#
# [oled]
# home_title = "NEXUS"
# clock_24h = true
#
# [alarms]
# show_warning_triangle = true
#
# [web]  # v první fázi není žádný web
# admin_listen = "127.0.0.1"
# admin_port = 8765  # plán, před nasazením ověřit dostupnost
# public_status_enabled = false
#
# [storage]  # žádná runtime DB zatím není; cesta bude schválena při nasazení
# history_mode = "events-only"
